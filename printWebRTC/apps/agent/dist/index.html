<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyPrint Agent</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 16px; background: #0f172a; color: #f8fafc;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 1.1rem; color: #38bdf8; font-weight: 600; }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 12px;
      font-size: 0.75rem; font-weight: 600; background: #1e293b; color: #94a3b8;
    }
    .badge.online { background: #064e3b; color: #4ade80; }
    .badge.error { background: #7f1d1d; color: #f87171; }
    .desc { color: #94a3b8; font-size: 0.8rem; margin: 0 0 12px 0; }
    .log-container {
      flex: 1; background: #1e293b; border-radius: 6px; padding: 8px 12px;
      overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: #cbd5e1;
    }
    .log-entry { margin-bottom: 4px; word-break: break-all; }
    .log-entry.info { color: #38bdf8; }
    .log-entry.success { color: #4ade80; }
    .log-entry.warn { color: #fbbf24; }
    .log-entry.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <h2>MyPrint Agent</h2>
    <span id="agent-status" class="badge">Connecting…</span>
  </div>
  <p id="status-desc" class="desc">Starting secure edge connection…</p>
  <div id="log-container" class="log-container"></div>
  <script src="renderer.js"></script>
</body>
</html>
